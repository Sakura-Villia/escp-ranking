name: Keep Cloudflare Project Active

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create keep-alive marker via API
        uses: actions/github-script@v7
        with:
          script: |
            const content = Buffer.from(`Last updated: ${new Date().toISOString()}\n`).toString('base64');
            
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.keep-alive'
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.keep-alive',
                message: 'chore: keep project active [skip ci]',
                content: content,
                sha: existing.data.sha
              });
            } catch (e) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.keep-alive',
                message: 'chore: keep project active [skip ci]',
                content: content
              });
            }
